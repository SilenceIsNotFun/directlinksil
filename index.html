<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join our Discord Server</title>

  <!-- Open Graph / Meta Preview -->
  <meta property="og:title" content="Join our Discord Server">
  <meta property="og:description" content="Klik link berikut untuk bergabung ke server Discord kami!">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#5865F2">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f1117;
      color: #e3e5e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e1f22;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .icon {
      width: 68px;
      height: 68px;
      background-color: #5865f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.45);
    }
    .icon svg {
      width: 40px;
      height: 40px;
      fill: #ffffff;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
    }
    p {
      font-size: 0.95rem;
      color: #949ba4;
      line-height: 1.5;
    }
    .code-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #5865f2;
      font-weight: 600;
    }
    .btn {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #5865f2;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 12px 24px;
      border-radius: 8px;
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn:hover {
      background-color: #4752c4;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 127.14 96.36">

      </svg>
    </div>
    <h1>Gabung Server Discord</h1>
    <p>Akses link redirect instan via <span class="code-badge">/discord</span> atau klik tombol di bawah.</p>
    <a href="/discord" class="btn">Buka Undangan Discord</a>
  </div>
</body>
</html>
